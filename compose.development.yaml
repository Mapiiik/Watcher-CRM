services:
  webserver-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.development
      args:
        - buildno
        - gitcommithash
    depends_on:
      - database-dev
      - database-radius-dev
      - cache-dev
      - mail-dev
    tmpfs:
      - /app/logs:uid=1000,gid=1000
      - /app/tmp:uid=1000,gid=1000
      - /app/vendor:uid=1000,gid=1000,exec
      - /app/node_modules:uid=1000,gid=1000,exec
    volumes:
      - ./:/app
    working_dir: /app/
    # the other development applications, reached through the ports they publish on the host
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # the certificate Caddy issues itself has to cover the name the other containers use
      SERVER_NAME: "localhost, host.docker.internal"
      # the mail ends up in Mailpit, http://localhost:8025
      EMAIL_TRANSPORT_DEFAULT_URL: smtp://mail-dev:1025
      EMAIL_TRANSPORT_INVOICES_URL: smtp://mail-dev:1025
      EMAIL_TRANSPORT_CONTRACTS_URL: smtp://mail-dev:1025
      EMAIL_TRANSPORT_SUPPORT_URL: smtp://mail-dev:1025
      DATABASE_URL: postgres://postgres@database-dev/watcher_crm
      DATABASE_RADIUS_URL: postgres://postgres@database-radius-dev/watcher_crm_radius
      CACHE_DURATION: "${CACHE_DURATION:-+2 minutes}"
      CACHE_DEFAULT_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_default_&duration=${CACHE_DURATION:-+2 minutes}"
      CACHE_CAKECORE_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_cake_core_&duration=${CACHE_DURATION:-+2 minutes}"
      CACHE_CAKEMODEL_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_cake_model_&duration=${CACHE_DURATION:-+2 minutes}"
      CACHE_APICLIENT_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_api_client_&duration=${CACHE_DURATION:-+2 minutes}"
      CACHE_ADDRESSES_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_api_addresses_&duration=${CACHE_DURATION:-+2 minutes}"
      CACHE_BUSINESS_REGISTER_URL: "redis://cache-dev:6379/?database=0&password=redis&prefix=${APP_NAME:-localhost}_business_register_&duration=${CACHE_DURATION:-+2 minutes}"
    ports:
      - 80:80/tcp # HTTP
      - 443:443/tcp # HTTPS
      - 443:443/udp # HTTP/3
    tty: true

  database-dev:
    image: postgres:18
    tmpfs:
      - /var/lib/postgresql:exec
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watcher_crm
    ports:
      - 5432:5432/tcp

  database-radius-dev:
    image: postgres:18
    tmpfs:
      - /var/lib/postgresql:exec
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watcher_crm_radius
    ports:
      - 5433:5432/tcp

  cache-dev:
    image: redis:alpine
    tmpfs: 
      - /data:exec
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass redis

  mail-dev:
    image: axllent/mailpit:v1.27
    ports:
      - 8025:8025/tcp # web interface
