<!--
  The icon of Watcher CRM, a W drawn as points joined by links. Watcher NMS has the same one in its
  own colour. favicon.ico and apple-touch-icon.png are made from it with ImageMagick and librsvg:
  magick -background none -density 1536 favicon.svg -define icon:auto-resize=48,32,16 favicon.ico
  magick -background "#2a6496" -density 540 favicon.svg -flatten apple-touch-icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2a6496"/>
  <polyline points="6,9.5 11,22.5 16,12.5 21,22.5 26,9.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  <g fill="#fff">
    <circle cx="6" cy="9.5" r="2.7"/>
    <circle cx="11" cy="22.5" r="2.7"/>
    <circle cx="21" cy="22.5" r="2.7"/>
    <circle cx="26" cy="9.5" r="2.7"/>
  </g>
  <circle cx="16" cy="12.5" r="3.2" fill="#d02f37" stroke="#fff" stroke-width="1.4"/>
</svg>
