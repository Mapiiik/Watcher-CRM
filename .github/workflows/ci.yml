name: CI

on:
  push:
    branches:
      - '2.x'
      - '3.x'
      - '4.x'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        db-type: [pgsql]
        dependencies: ['locked', 'highest']
        include:
          - php-version: '8.2'
            db-type: pgsql
            dependencies: 'highest'
          - php-version: '8.3'
            db-type: pgsql
            dependencies: 'highest'

    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_crm_test
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      # RADIUS has its own database in production, and so does the test suite - tests/bootstrap.php
      # builds the schema into it, so an empty database is all this has to provide.
      postgres-radius:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_crm_test_radius
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      redis:
        image: redis
        ports:
          - 6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: ${{ matrix.php-version }}
            extensions: mbstring, intl, redis, dbase, pdo_${{ matrix.db-type }}
            coverage: pcov

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Composer post install command
        if: ${{ matrix.dependencies != 'locked' }}
        run: composer run-script post-install-cmd --no-interaction

      # Coverage is measured on one combination of the matrix only. It is the same code whichever
      # PHP runs it, and measuring it six times would cost six times as long for one answer.
      - name: Test with phpunit
        run: |
          if [ "${{ matrix.php-version }}" = "8.4" ] && [ "${{ matrix.dependencies }}" = "locked" ]; then
            vendor/bin/phpunit --coverage-text=coverage.txt --coverage-html coverage-html
            {
              echo '## Code coverage'
              echo
              echo '```'
              # the report is written with the colours the suite is configured for, which read as
              # escape codes rather than as colour anywhere but a terminal
              sed -n '/Summary:/,/^ *$/p' coverage.txt | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
              echo
              echo 'Line coverage counts what ran, not what was asserted - the controller tests'
              echo 'request every action once, so they carry a lot of lines without holding them'
              echo 'to anything. Read it as an upper bound.'
              echo
              echo 'The report per class is in the `coverage-html` artifact of this run.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            vendor/bin/phpunit
          fi
        env:
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DATABASE_TEST_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/watcher_crm_test
          DATABASE_TEST_RADIUS_URL: postgres://postgres@127.0.0.1:${{ job.services['postgres-radius'].ports['5432'] }}/watcher_crm_test_radius
          DEBUG: 'true'

      - name: Keep the coverage report
        if: ${{ matrix.php-version == '8.4' && matrix.dependencies == 'locked' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, redis, dbase
          tools: cs2pr
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

#      - name: Run psalm
#        if: success() || failure()
#        run: vendor/bin/psalm.phar --output-format=github

      - name: Run phpstan
        if: success() || failure()
        run: vendor/bin/phpstan.phar analyse --error-format=checkstyle | cs2pr
